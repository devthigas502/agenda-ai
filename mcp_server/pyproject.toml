[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenda-ai-mcp"
version = "0.1.0"
description = "Servidor MCP em Python para cadastro e integração de serviços com o Agenda AI"
authors = [
    { name = "Agenda AI Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0"
]

[project.scripts]
agenda-ai-mcp = "mcp_server.server:main"
